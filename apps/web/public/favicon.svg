<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="92" height="92" x="4" y="4" rx="20" fill="url(#bgGrad)" />

  <!-- Archery Target -->
  <circle cx="50" cy="50" r="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  <circle cx="50" cy="50" r="28" fill="#38bdf8" />
  <circle cx="50" cy="50" r="19" fill="#ef4444" />
  <circle cx="50" cy="50" r="10" fill="#f59e0b" />
  <circle cx="50" cy="50" r="4" fill="#b45309" />

  <!-- Elemental Spark Orbs -->
  <circle cx="20" cy="20" r="5" fill="#ea580c" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="80" cy="20" r="5" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="20" cy="80" r="5" fill="#059669" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="80" cy="80" r="5" fill="#d97706" stroke="#ffffff" stroke-width="1.5" />

  <!-- Archery Bow (Arc) -->
  <path d="M 22 28 A 38 38 0 0 0 22 72" fill="none" stroke="#fef08a" stroke-width="3.5" stroke-linecap="round" />
  <!-- Bowstring -->
  <line x1="22" y1="28" x2="22" y2="72" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2 1" opacity="0.9" />

  <!-- Arrow passing through target -->
  <line x1="18" y1="50" x2="58" y2="50" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" />
  <!-- Arrowhead -->
  <polygon points="64,50 54,45 56,50 54,55" fill="#f59e0b" stroke="#b45309" stroke-width="0.5" />
  <!-- Feathers (fletching) -->
  <polygon points="18,50 12,45 10,46 14,50" fill="#ef4444" />
  <polygon points="18,50 12,55 10,54 14,50" fill="#38bdf8" />
</svg>

